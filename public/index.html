<!-- MODAL DE RASTREIO MENSAL -->
<div id="modal-rastreio-mensal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-2 sm:p-4">
<div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-[98vw] w-full h-[92vh] flex flex-col p-4 sm:p-6 shadow-2xl">
<div class="flex justify-between items-center pb-3 border-b border-slate-800 flex-wrap gap-3">
<div><h3 class="text-sm sm:text-lg font-bold text-cyan-400">Rastreio Mensal</h3><p class="text-[11px] text-slate-400">Permanência por setor e movimentações</p></div>
<div class="flex items-center gap-2">
  <input type="month" id="rastreio-mes" class="input text-sm w-auto" onchange="renderizarRastreioMensal()">
  <button onclick="fecharRastreioMensal()" class="btn btn-ghost btn-icon"><i data-lucide="x" class="w-5 h-5"></i></button>
</div>
</div>
<div class="mt-3 relative">
  <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
  <input type="text" id="rastreio-busca" placeholder="Buscar colaborador..." oninput="renderizarRastreioMensal()" class="input pl-9">
</div>
<div id="rastreio-resumo" class="grid grid-cols-2 sm:grid-cols-4 gap-2 my-3"></div>
<div id="rastreio-conteudo" class="flex-grow overflow-auto pr-1 space-y-4"></div>
<div class="flex justify-end pt-2 border-t border-slate-800 mt-3"><button onclick="fecharRastreioMensal()" class="btn btn-secondary">Fechar</button></div>
</div>
</div>
